<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Shadow Moons | Clover Origins</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#020107;
    color:#fff;
    font-family:Georgia,"Times New Roman",serif;
    overflow-x:hidden;
}

body.intro-active{
    overflow:hidden;
}

button,a{
    font-family:inherit;
}

/* =========================================================
   COSMIC BACKGROUND
========================================================= */

.space{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 35%,rgba(108,35,170,.18),transparent 30%),
        radial-gradient(circle at 15% 80%,rgba(75,25,120,.12),transparent 30%),
        #020107;
}

.moon{
    position:absolute;
    width:650px;
    height:650px;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
    border-radius:50%;

    background:
        radial-gradient(circle at 35% 30%,
        rgba(255,255,255,.95),
        rgba(210,203,218,.85) 28%,
        rgba(124,113,134,.55) 58%,
        rgba(31,25,39,.95));

    opacity:.16;

    box-shadow:
        0 0 40px rgba(220,210,230,.25),
        0 0 120px rgba(133,70,182,.22),
        0 0 220px rgba(102,39,150,.15);

    animation:moonFloat 12s ease-in-out infinite,
              moonPulse 7s ease-in-out infinite;
}

@keyframes moonFloat{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-53%) scale(1.04)}
}

@keyframes moonPulse{
    0%,100%{opacity:.12}
    50%{opacity:.22}
}

.moon-glow{
    position:absolute;
    width:950px;
    height:950px;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(147,71,201,.13),
        transparent 65%
    );

    animation:glowPulse 8s ease-in-out infinite;
}

@keyframes glowPulse{
    0%,100%{transform:translate(-50%,-50%) scale(.9)}
    50%{transform:translate(-50%,-50%) scale(1.1)}
}

.stars,
.particles{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    opacity:.4;

    animation:
        starMove linear infinite,
        starTwinkle ease-in-out infinite;
}

@keyframes starMove{
    from{transform:translate(0,0)}
    to{transform:translate(30px,-120px)}
}

@keyframes starTwinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.7);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#a95ee4;
    box-shadow:
        0 0 8px #a95ee4,
        0 0 18px rgba(169,94,228,.5);

    animation:particleMove linear infinite;
}

@keyframes particleMove{
    0%{
        transform:translateY(110vh);
        opacity:0;
    }

    10%{opacity:.6}

    90%{opacity:.4}

    100%{
        transform:translate(80px,-20vh);
        opacity:0;
    }
}

/* =========================================================
   INTRO
========================================================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(circle at center,
        rgba(91,34,130,.25),
        transparent 35%),
        #020107;

    transition:opacity 1.5s ease,
               visibility 1.5s ease;
}

#intro.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.intro-stars{
    position:absolute;
    inset:0;
}

.intro-star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:.3;
    animation:introStar 4s ease-in-out infinite;
}

@keyframes introStar{
    0%,100%{
        opacity:.15;
        transform:scale(.5);
    }
    50%{
        opacity:1;
        transform:scale(1.7);
    }
}

.intro-content{
    position:relative;
    z-index:5;
    text-align:center;
    width:min(950px,90%);
}

.credit{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    width:90%;

    opacity:0;

    color:#aaa2b1;
    font-size:12px;
    letter-spacing:6px;
    text-transform:uppercase;

    animation:creditRoll 13s ease forwards;
}

.credit-one{animation-delay:.5s}
.credit-two{animation-delay:3s}
.credit-three{animation-delay:5.5s}
.credit-four{animation-delay:8s}

@keyframes creditRoll{
    0%{
        opacity:0;
        transform:translate(-50%,25px);
    }

    10%{
        opacity:1;
        transform:translate(-50%,0);
    }

    22%{
        opacity:1;
        transform:translate(-50%,-10px);
    }

    30%,100%{
        opacity:0;
        transform:translate(-50%,-30px);
    }
}

.intro-logo{
    width:280px;
    max-width:65vw;

    opacity:0;

    filter:
        drop-shadow(0 0 15px rgba(165,70,230,.8))
        drop-shadow(0 0 60px rgba(120,40,180,.5));

    animation:introLogo 4s ease forwards;
    animation-delay:9.5s;
}

@keyframes introLogo{
    0%{
        opacity:0;
        transform:scale(.65);
        filter:brightness(0);
    }

    45%{
        opacity:1;
        transform:scale(1.08);
    }

    70%,100%{
        opacity:1;
        transform:scale(1);
    }
}

.intro-title{
    margin-top:28px;

    opacity:0;

    font-size:clamp(30px,6vw,70px);
    letter-spacing:12px;
    font-weight:400;

    text-transform:uppercase;

    text-shadow:
        0 0 20px rgba(190,110,245,.45),
        0 0 60px rgba(130,50,190,.25);

    animation:introTitle 3s ease forwards;
    animation-delay:11s;
}

@keyframes introTitle{
    from{
        opacity:0;
        letter-spacing:25px;
    }

    to{
        opacity:1;
        letter-spacing:12px;
    }
}

.intro-line,
.divider{
    width:150px;
    height:1px;
    margin:28px auto;

    background:linear-gradient(
        90deg,
        transparent,
        #b061e4,
        transparent
    );

    box-shadow:0 0 18px rgba(176,97,228,.8);
}

.intro-line{
    opacity:0;
    animation:introLine 2s ease forwards;
    animation-delay:11.8s;
}

@keyframes introLine{
    to{opacity:1}
}

.intro-subtitle{
    color:#8f8798;
    font-size:11px;
    letter-spacing:5px;

    opacity:0;
    animation:fadeIn 2s ease forwards;
    animation-delay:12.3s;
}

@keyframes fadeIn{
    to{opacity:1}
}

.skip-intro{
    position:absolute;
    right:40px;
    bottom:35px;

    padding:10px 18px;

    border:1px solid rgba(180,90,240,.35);
    background:rgba(80,30,110,.12);

    color:#8d8495;

    font-size:9px;
    letter-spacing:3px;
    text-transform:uppercase;

    cursor:pointer;

    transition:.3s;
}

.skip-intro:hover{
    color:white;
    border-color:#c478ff;
    box-shadow:0 0 20px rgba(168,76,226,.25);
}

/* =========================================================
   NAVIGATION
========================================================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    z-index:100;

    background:linear-gradient(
        to bottom,
        rgba(2,1,7,.92),
        rgba(2,1,7,0)
    );

    backdrop-filter:blur(8px);
}

.nav-logo{
    display:flex;
    align-items:center;
    gap:12px;

    font-size:14px;
    letter-spacing:4px;
    font-weight:bold;
}

.nav-logo img{
    width:44px;
    height:44px;
    object-fit:contain;

    filter:drop-shadow(
        0 0 8px rgba(153,68,214,.8)
    );
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:#aaa3b0;
    text-decoration:none;

    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;

    transition:.35s;
}

.nav-links a:hover{
    color:#c478ff;
    text-shadow:0 0 15px rgba(196,120,255,.8);
}

.discord-nav{
    color:#c478ff !important;
}

/* =========================================================
   GENERAL
========================================================= */

section{
    position:relative;
}

section:not(.hero){
    padding:130px 6%;
    max-width:1500px;
    margin:auto;
}

.section-heading{
    text-align:center;
    margin-bottom:70px;
}

.eyebrow{
    color:#a45fd1;
    font-size:10px;
    letter-spacing:7px;
    text-transform:uppercase;
}

.section-heading h2{
    margin-top:15px;
    font-size:clamp(32px,5vw,58px);
    letter-spacing:6px;
    font-weight:400;
    text-transform:uppercase;
}

.section-heading p{
    max-width:680px;
    margin:auto;
    color:#8f8798;
    line-height:1.8;
    font-size:15px;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:120px 20px 80px;
}

.hero-content{
    max-width:1000px;
}

.hero-logo{
    width:280px;
    max-width:65vw;
    margin-bottom:30px;

    filter:
        drop-shadow(0 0 10px rgba(149,64,210,.7))
        drop-shadow(0 0 35px rgba(120,40,180,.35));

    animation:logoFloat 6s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}

.hero h1{
    margin-top:18px;

    font-size:clamp(42px,8vw,94px);
    letter-spacing:9px;
    line-height:1;

    font-weight:400;
    text-transform:uppercase;

    text-shadow:
        0 0 15px rgba(190,112,245,.25),
        0 0 50px rgba(130,50,190,.2);
}

.tagline{
    color:#aaa2b1;
    max-width:600px;
    margin:0 auto 40px;

    font-size:17px;
    line-height:1.8;
    letter-spacing:1px;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;

    padding:15px 28px;

    border:1px solid rgba(177,91,232,.55);

    background:rgba(100,38,140,.13);

    color:white;

    text-decoration:none;

    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;

    transition:.4s;
    cursor:pointer;

    backdrop-filter:blur(5px);
}

.btn:hover{
    transform:translateY(-4px);
    border-color:#c47aff;
    box-shadow:0 0 20px rgba(168,76,226,.35);
}

.discord-btn{
    background:rgba(117,45,167,.38);
}

/* =========================================================
   SOVEREIGN
========================================================= */

.sovereign-section{
    padding-top:160px !important;
}

.sovereign-card{
    position:relative;

    max-width:1050px;
    margin:auto;

    padding:75px 45px;

    text-align:center;

    border:1px solid rgba(207,137,255,.55);

    background:
        radial-gradient(
            circle at center,
            rgba(105,35,155,.22),
            rgba(5,2,12,.88) 65%
        );

    box-shadow:
        0 0 100px rgba(120,40,180,.15),
        inset 0 0 80px rgba(120,40,180,.05);

    overflow:hidden;
}

.sovereign-card::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            110deg,
            transparent,
            rgba(207,137,255,.08),
            transparent
        );

    transform:translateX(-100%);
    animation:sovereignShimmer 6s linear infinite;
}

@keyframes sovereignShimmer{
    to{transform:translateX(100%)}
}

.crown{
    position:relative;
    z-index:2;

    font-size:75px;

    filter:drop-shadow(
        0 0 25px rgba(255,211,105,.55)
    );

    animation:crownFloat 4s ease-in-out infinite;
}

@keyframes crownFloat{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-8px) rotate(2deg)}
}

.sovereign-label{
    position:relative;
    z-index:2;

    margin-top:20px;

    color:#b66ce7;
    font-size:10px;
    letter-spacing:7px;
    text-transform:uppercase;
}

.sovereign-name{
    position:relative;
    z-index:2;

    margin-top:20px;

    font-size:clamp(38px,7vw,72px);
    font-weight:400;
    letter-spacing:5px;

    text-shadow:
        0 0 20px rgba(203,125,255,.45);
}

.sovereign-title{
    position:relative;
    z-index:2;

    margin-top:12px;

    color:#aaa2b1;
    letter-spacing:4px;
    text-transform:uppercase;
    font-size:11px;
}

.sovereign-description{
    position:relative;
    z-index:2;

    max-width:700px;
    margin:30px auto;

    color:#9d94a5;
    line-height:1.9;
}

.quote-title{
    position:relative;
    z-index:2;

    margin-top:55px;

    color:#a45fd1;
    font-size:9px;
    letter-spacing:5px;
    text-transform:uppercase;
}

.quotes{
    position:relative;
    z-index:2;

    max-width:760px;
    margin:25px auto 0;
}

.quote{
    font-size:20px;
    line-height:1.8;
    color:#d4cdd9;

    padding:25px 10px;

    border-top:1px solid rgba(180,90,240,.12);
}

.quote:last-child{
    border-bottom:1px solid rgba(180,90,240,.12);
}

.quote-mark{
    color:#b061e4;
    font-size:35px;
}

/* =========================================================
   HOUSES
========================================================= */

.houses-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:24px;
}

.house-card{
    position:relative;

    min-height:350px;

    padding:38px 28px;

    text-align:center;

    border:1px solid rgba(161,83,214,.2);

    background:
        linear-gradient(
            145deg,
            rgba(80,30,110,.18),
            rgba(10,5,18,.65)
        );

    backdrop-filter:blur(12px);

    overflow:hidden;

    transition:.5s;

    cursor:pointer;
}

.house-card::before{
    content:"";
    position:absolute;
    inset:-2px;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(183,93,239,.15),
            transparent
        );

    transform:translateX(-100%);
    transition:.8s;
}

.house-card:hover::before{
    transform:translateX(100%);
}

.house-card:hover{
    transform:translateY(-12px) scale(1.02);

    border-color:rgba(194,110,255,.65);

    box-shadow:
        0 20px 60px rgba(90,30,130,.25),
        0 0 30px rgba(160,70,220,.12);
}

.house-symbol{
    font-size:48px;
    margin-bottom:20px;
}

.house-card h3{
    font-size:24px;
    font-weight:400;
    letter-spacing:2px;
    margin-bottom:12px;
}

.house-role{
    color:#a45fd1;
    font-size:9px;
    letter-spacing:3px;
}

.house-stars{
    margin:24px 0;
    font-size:24px;
    color:#f1d68a;
    text-shadow:0 0 15px rgba(241,214,138,.4);
}

.house-card p{
    color:#82798b;
    font-size:13px;
    margin-bottom:25px;
}

/* =========================================================
   LEADERBOARD
========================================================= */

.leaderboard{
    max-width:950px;
    margin:auto;

    border:1px solid rgba(161,83,214,.2);

    background:rgba(9,4,15,.65);

    backdrop-filter:blur(14px);
}

.leader-row{
    display:grid;
    grid-template-columns:80px 1fr 150px;

    align-items:center;

    padding:22px 28px;

    border-bottom:1px solid rgba(255,255,255,.05);

    transition:.35s;
}

.leader-row:last-child{
    border-bottom:none;
}

.leader-row:hover{
    background:rgba(147,71,201,.08);
    padding-left:38px;
}

.leader-row strong{
    color:#756c7e;
    letter-spacing:2px;
}

.leader-row b{
    text-align:right;
    color:#f1d68a;
    text-shadow:0 0 12px rgba(241,214,138,.35);
}

.first{border-left:3px solid #e8c96a}
.second{border-left:3px solid #c8c8d0}
.third{border-left:3px solid #b87955}

/* =========================================================
   LEADERSHIP
========================================================= */

.leadership-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(280px,1fr));
    gap:30px;
    max-width:1000px;
    margin:auto;
}

.person-card{
    position:relative;

    padding:45px 30px;

    text-align:center;

    border:1px solid rgba(161,83,214,.25);

    background:
        linear-gradient(
            145deg,
            rgba(85,30,120,.18),
            rgba(5,3,10,.75)
        );

    cursor:pointer;

    transition:.5s;

    overflow:hidden;
}

.person-card:hover{
    transform:translateY(-10px);
    border-color:rgba(196,120,255,.7);

    box-shadow:
        0 20px 70px rgba(90,30,130,.3);
}

.person-card img{
    width:170px;
    height:170px;

    object-fit:cover;

    border-radius:50%;

    border:1px solid rgba(196,120,255,.5);

    box-shadow:
        0 0 35px rgba(150,60,220,.25);

    margin-bottom:25px;
}

.person-card h3{
    font-size:28px;
    font-weight:400;
}

.person-card .rank{
    display:block;

    margin-top:10px;

    color:#a45fd1;

    font-size:9px;
    letter-spacing:4px;
    text-transform:uppercase;
}

.person-card .hint{
    display:block;

    margin-top:20px;

    color:#706777;

    font-size:8px;
    letter-spacing:3px;
    text-transform:uppercase;
}

/* =========================================================
   LORDS / VICE LORDS
========================================================= */

.lords-grid,
.vice-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:22px;
}

.lord-card,
.vice-card{
    position:relative;

    padding:35px 20px;

    text-align:center;

    border:1px solid rgba(161,83,214,.2);

    background:
        linear-gradient(
            145deg,
            rgba(65,22,95,.18),
            rgba(5,3,10,.72)
        );

    cursor:pointer;

    transition:.45s;
}

.lord-card:hover,
.vice-card:hover{
    transform:translateY(-8px);

    border-color:rgba(196,120,255,.65);

    box-shadow:
        0 15px 50px rgba(90,30,130,.25);
}

.lord-card img,
.vice-card img{
    width:125px;
    height:125px;

    object-fit:cover;

    border-radius:50%;

    border:1px solid rgba(194,110,255,.45);

    box-shadow:
        0 0 25px rgba(150,60,220,.2);

    margin-bottom:20px;
}

.lord-card h3,
.vice-card h3{
    font-size:19px;
    font-weight:400;
}

.lord-card span,
.vice-card span{
    display:block;

    margin-top:9px;

    color:#a45fd1;

    font-size:8px;
    letter-spacing:3px;
    text-transform:uppercase;
}

/* =========================================================
   EVENTS
========================================================= */

.events-box{
    max-width:950px;
    margin:auto;

    min-height:250px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    border:1px solid rgba(161,83,214,.25);

    background:
        radial-gradient(
            circle,
            rgba(90,30,130,.15),
            rgba(5,3,10,.75)
        );

    box-shadow:
        inset 0 0 60px rgba(120,40,180,.04);
}

.events-box h3{
    font-size:30px;
    font-weight:400;
    letter-spacing:5px;
}

.events-box p{
    margin-top:15px;
    color:#8f8798;
    letter-spacing:4px;
    font-size:10px;
    text-transform:uppercase;
}

/* =========================================================
   PERSON MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;

    z-index:800;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.86);

    backdrop-filter:blur(15px);

    opacity:0;
    visibility:hidden;

    transition:.4s;
}

.modal.active{
    opacity:1;
    visibility:visible;
}

.modal-box{
    position:relative;

    width:min(650px,95vw);

    padding:45px 35px;

    text-align:center;

    border:1px solid rgba(194,110,255,.6);

    background:
        radial-gradient(
            circle at top,
            rgba(95,30,135,.35),
            rgba(4,2,9,.98) 70%
        );

    box-shadow:
        0 0 100px rgba(126,45,180,.3);

    transform:scale(.8) translateY(30px);

    transition:.5s;
}

.modal.active .modal-box{
    transform:scale(1) translateY(0);
}

.modal-box img{
    width:150px;
    height:150px;

    object-fit:cover;

    border-radius:50%;

    border:1px solid rgba(196,120,255,.6);

    box-shadow:
        0 0 40px rgba(160,70,220,.3);

    margin-bottom:20px;
}

.modal-box .modal-rank{
    display:block;

    color:#a45fd1;

    font-size:9px;
    letter-spacing:4px;
    text-transform:uppercase;
}

.modal-box h2{
    margin-top:15px;

    font-size:36px;
    font-weight:400;
    letter-spacing:3px;
}

.modal-box p{
    max-width:520px;

    margin:25px auto;

    color:#a9a0b1;

    line-height:1.9;
}

.close-modal{
    position:absolute;

    top:15px;
    right:18px;

    width:38px;
    height:38px;

    border:1px solid rgba(194,110,255,.5);

    border-radius:50%;

    background:#09040f;

    color:white;

    font-size:22px;

    cursor:pointer;

    transition:.3s;
}

.close-modal:hover{
    transform:rotate(90deg);
    color:#d58aff;
}

<script>

/* =========================================================

const stars =

for(let i=0;i<180;i++){

    star.className="star";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    star.style.animationDuration=
        (3+Math.random()*7)+"s";

    star.style.animationDelay=
        Math.random()*5+"s";

    stars.appendChild(star);
}


/* =========================================================
   PARTICLES
========================================================= */

const particles =
    document.getElementById("particles");

for(let i=0;i<35;i++){

    const particle=document.createElement("div");

    particle.className="particle";

    particle.style.left=
        Math.random()*100+"%";

    particle.style.animationDuration=
        (8+Math.random()*12)+"s";

    particle.style.animationDelay=
        Math.random()*10+"s";

    particles.appendChild(particle);
}


/* =========================================================
   MUSIC
========================================================= */

const musicIntro =
    document.getElementById("musicIntro");

const musicMain =
    document.getElementById("musicMain");

const musicDark =
    document.getElementById("musicDark");

let musicStarted=false;

musicIntro.volume=.75;
musicMain.volume=.75;
musicDark.volume=.75;


function startMusic(){

    if(musicStarted) return;

    musicIntro.play()
    .then(()=>{
        musicStarted=true;
    })
    .catch(()=>{
        musicStarted=false;
    });
}


/*
    INTRO TRACK
    →
    MAIN TRACK
*/

musicIntro.addEventListener(
    "ended",
    ()=>{
        musicMain.currentTime=0;

        musicMain.play()
        .catch(()=>{});
    }
);


/*
    MAIN TRACK
    →
    DARK TRACK
*/

musicMain.addEventListener(
    "ended",
    ()=>{
        musicDark.currentTime=0;

        musicDark.play()
        .catch(()=>{});
    }
);


/*
    DARK TRACK LOOPS
*/

musicDark.addEventListener(
    "ended",
    ()=>{
        musicDark.currentTime=0;

        musicDark.play()
        .catch(()=>{});
    }
);


/*
    TRY AUTOPLAY
*/

window.addEventListener(
    "load",
    ()=>{
        setTimeout(startMusic,500);
    }
);


/*
    FALLBACK FOR BROWSERS
    THAT BLOCK AUTOPLAY
*/

[
    "click",
    "keydown",
    "touchstart",
    "pointerdown"
].forEach(eventName=>{

    document.addEventListener(
        eventName,
        startMusic,
        {
            once:true,
            passive:true
        }
    );

});

   INTRO
========================================================= */

const intro =
    document.getElementById("intro");

let introFinished=false;


function finishIntro(){

    if(introFinished) return;

    introFinished=true;

    intro.classList.add("hidden");

    document.body.classList.remove(
        "intro-active"
    );
}


function skipIntro(){

    finishIntro();

    startMusic();
}


setTimeout(
    finishIntro,
    16500
);

document.getElementById(

    }
);
